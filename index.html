<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Horario Mensual</title>

<style>

body{
    font-family: Arial, sans-serif;
    margin:20px;
}

h1{
    color:#0d47a1;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th{
    background:#1976d2;
    color:white;
    padding:8px;
}

td{
    border:1px solid #ccc;
    padding:6px;
    text-align:center;
}

input[type="time"]{
    width:110px;
}

button{
    padding:10px 15px;
    margin-left:10px;
    cursor:pointer;
}
.tipoDia{
    width:140px;
    padding:4px;
}

.feriadoFila{
    background:#e8f5e9;
    color:#2e7d32;
    font-weight:bold;
}

option[value="licencia"]{
    background:#fff3cd;
}

option[value="feriado"]{
    background:#d4edda;
}

.positivo{
    color:green;
    font-weight:bold;
}

.negativo{
    color:red;
    font-weight:bold;
}

.error{
    background:#ffd6d6;
    border:2px solid red;
}

.semana{
    background:#f5f5f5;
    font-weight:bold;
}

#resumen{
    margin-top:20px;
    padding:15px;
    border:1px solid #ccc;
    background:#fafafa;
    font-size:18px;
}

.faltante{
    color:red;
    font-weight:bold;
    font-size:24px;
    animation:parpadeo 1s infinite;
}

.sobrante{
    color:green;
    font-weight:bold;
    font-size:24px;
}

@keyframes parpadeo{
    50%{
        opacity:0;
    }
}

#usuario{
    display:flex;
    justify-content:flex-end;
    margin-bottom:15px;
}
body{
    font-family:Arial,sans-serif;
    margin:10px;
    overflow-x:auto;
    background:#f4f7fa;
    margin:10px;
    overflow-x:auto;
}
table{
    width:100%;
    min-width:750px;
    background:white;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}
input[type="time"]{
    width:100%;
    min-width:90px;
}
button{
    padding:10px;
    border:none;
    border-radius:8px;
}
#resumen{
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
    background:white;
}
@media (max-width:768px){

    h1{
        font-size:22px;
    }

    #usuario{
        justify-content:center;
    }

    #usuario > div{
        width:100%;
    }

    button{
        width:100%;
        margin-top:5px;
    }
}
</style>
</head>

<body>

<h1>Control Horario Mensual</h1>

<label>Mes:</label>
<select id="mes">
<option value="0">Enero</option>
<option value="1">Febrero</option>
<option value="2">Marzo</option>
<option value="3">Abril</option>
<option value="4">Mayo</option>
<option value="5">Junio</option>
<option value="6">Julio</option>
<option value="7">Agosto</option>
<option value="8">Septiembre</option>
<option value="9">Octubre</option>
<option value="10">Noviembre</option>
<option value="11">Diciembre</option>
</select>

<label>Año:</label>
<input type="number" id="anio" value="2026">

<div id="usuario"></div>

<table id="tabla">

<thead>
<tr>
<th>Fecha</th>
<th>Hora Entrada</th>
<th>Salida Mínima (3h)</th>
<th>Salida Objetivo (6h)</th>
<th>Hora Salida Real</th>
<th>Saldo Diario</th>
<th>Saldo Acumulado</th>
</tr>
</thead>

<tbody>

</tbody>

</table>

<div id="resumen"></div>

<script>

const OBJETIVO_DIARIO = 360;
const MINIMO_DIARIO = 180;

let objetivoMensual = 0;
let diasHabilesMes = 0;
let periodoActual = null;

function obtenerPeriodo(){

    const anio =
        document.getElementById("anio").value;

    const mes =
        document.getElementById("mes").value;

    return `${anio}-${mes}`;
}

async function cambiarPeriodo(){

    await guardarPeriodoFirebase();

    generarMes();

    await cargarPeriodoFirebase();

    periodoActual =
        obtenerPeriodo();
}

function borrarDatos(){
    generarMes();

    alert(
        "Datos eliminados"
    );
}

function minutos(hora){

    if(!hora) return 0;

    let partes = hora.split(":");

    return parseInt(partes[0]) * 60 +
           parseInt(partes[1]);
}

function horaDesdeMinutos(total){

    let h = Math.floor(total/60);
    let m = total % 60;

    return String(h).padStart(2,'0')
    + ':'
    + String(m).padStart(2,'0');
}
function formatearFecha(fecha){
	const dias = [
		"Dom",
		"Lun",
		"Mar",
		"Mié",
		"Jue",
		"Vie",
		"Sáb"
	];
	return dias[fecha.getDay()] + " " + fecha.getDate();
}
function formatoSaldo(minutos){

    const signo =
        minutos < 0 ? "-" : "+";

    minutos = Math.abs(minutos);

    let horas =
        Math.floor(minutos / 60);

    let mins =
        minutos % 60;

    return signo +
        String(horas).padStart(2,'0')
        + ':'
        + String(mins).padStart(2,'0');
}

function generarMes(){

    const mes =
        parseInt(
            document.getElementById("mes").value
        );

    const anio =
        parseInt(
            document.getElementById("anio").value
        );

    const tbody =
        document.querySelector("#tabla tbody");

    tbody.innerHTML = "";

    diasHabilesMes = 0;

    const ultimoDia =
        new Date(anio, mes + 1, 0).getDate();

    let semanaNumero = 1;

    for(let dia=1; dia<=ultimoDia; dia++){

        let fecha =
            new Date(anio, mes, dia);

        let dow = fecha.getDay();

        if(dow === 0 || dow === 6){
            continue;
        }

        diasHabilesMes++;

        let fila =
            document.createElement("tr");

        fila.innerHTML = `
			<td>
				<select class="tipoDia">
					<option value="normal">
						${formatearFecha(fecha)}
					</option>
					<option value="licencia">
						Licencia
					</option>
					<option value="feriado">
						Feriado
					</option>
				</select>
			</td>

			<td>
				<input type="time" class="entrada">
			</td>

			<td class="minima"></td>

			<td class="objetivo"></td>

			<td>
				<input type="time" class="real">
			</td>

			<td class="saldo"></td>

			<td class="acumulado"></td>
		`;

        tbody.appendChild(fila);

		if(dow === 5){

			let filaSemana =
				document.createElement("tr");

			filaSemana.className = "semana";

			filaSemana.innerHTML = `
			<td colspan="7"
				id="semana_${semanaNumero}">
				Semana ${semanaNumero}
			</td>
			`;

			tbody.appendChild(filaSemana);

			semanaNumero++;
		}
	}

	const ultimaFila = tbody.lastElementChild;

	if(
		ultimaFila &&
		!ultimaFila.classList.contains("semana")
	){

		let filaSemana =
			document.createElement("tr");

		filaSemana.className = "semana";

		filaSemana.innerHTML = `
		<td colspan="7"
			id="semana_${semanaNumero}">
			Semana ${semanaNumero}
		</td>
		`;

		tbody.appendChild(filaSemana);
	}
    objetivoMensual =
        diasHabilesMes *
        OBJETIVO_DIARIO;

    recalcular();
}
function actualizarTipoDia(){

    document
        .querySelectorAll("#tabla tbody tr")
        .forEach(fila=>{

            if(fila.classList.contains("semana")){
                return;
            }

            const tipo =
                fila.querySelector(".tipoDia");

            const entrada =
                fila.querySelector(".entrada");

            const real =
                fila.querySelector(".real");

            if(tipo.value === "licencia"){

                entrada.value = "09:00";
                real.value = "15:00";

                entrada.disabled = true;
                real.disabled = true;

                fila.querySelector(".saldo").textContent = "";
                fila.querySelector(".acumulado").textContent ="";

            }else if(tipo.value === "feriado"){

                entrada.value = "";
                real.value = "";

                entrada.disabled = true;
                real.disabled = true;

                        }else{

                if(
                    tipo.dataset.anterior === "licencia" ||
                    tipo.dataset.anterior === "feriado"
                ){
                    entrada.value = "";
                    real.value = "";

                    fila.querySelector(".minima").textContent = "";
                    fila.querySelector(".objetivo").textContent = "";
                    fila.querySelector(".saldo").textContent = "";
                    fila.querySelector(".acumulado").textContent = "";
                }

                entrada.disabled = false;
                real.disabled = false;
            }

            tipo.dataset.anterior =
                tipo.value;

        });

    recalcular();
}

function recalcular(){

    let filas =
        document.querySelectorAll(
            "#tabla tbody tr"
        );

    let trabajadoMes = 0;
    let acumulado = 0;
    let saldoSemana = 0;
    let nroSemana = 1;
	let cantidadFeriados = 0;

    filas.forEach(fila=>{

        if(fila.classList.contains("semana")){

            let celda =
                document.getElementById(
                    "semana_"+nroSemana
                );

            celda.innerHTML =
                saldoSemana >= 0
                ? `Semana ${nroSemana}: <span class="positivo">+${formatoSaldo(saldoSemana)}</span>`
                : `Semana ${nroSemana}: <span class="negativo">${saldoSemana} minutos</span>`;

            saldoSemana = 0;
            nroSemana++;

            return;
        }

        let entrada =
			fila.querySelector(".entrada");

		let real =
			fila.querySelector(".real");

		let tipo =
			fila.querySelector(".tipoDia");

		entrada.classList.remove("error");
		real.classList.remove("error");

		if(
			tipo &&
			(
				tipo.value === "licencia" ||
				tipo.value === "feriado"
			)
		){

			if(tipo.value === "feriado"){

				cantidadFeriados++;

				fila.querySelector(".minima").textContent =
					"Feriado";

				fila.querySelector(".objetivo").textContent =
					"Feriado";

				fila.querySelector(".saldo").textContent =
					"Feriado";

				fila.querySelector(".acumulado").textContent =
					"";

				return;
			}

			if(tipo.value === "licencia"){

				fila.querySelector(".minima").textContent =
					"12:00";

				fila.querySelector(".objetivo").textContent =
					"15:00";

				trabajadoMes += OBJETIVO_DIARIO;

				return;
			}
		}

        if(!entrada.value){
            return;
        }

        let minEntrada =
            minutos(entrada.value);

        fila.querySelector(".minima").textContent =
            horaDesdeMinutos(
                minEntrada + MINIMO_DIARIO
            );

        fila.querySelector(".objetivo").textContent =
            horaDesdeMinutos(
                minEntrada + OBJETIVO_DIARIO
            );

        if(!real.value){
            return;
        }

        let minReal =
            minutos(real.value);

        if(minReal <= minEntrada){

            real.classList.add("error");

            fila.querySelector(".saldo").innerHTML =
                "<span class='negativo'>Error</span>";

            return;
        }

        if((minReal - minEntrada) < MINIMO_DIARIO){

            real.classList.add("error");

            fila.querySelector(".saldo").innerHTML =
                "<span class='negativo'>Menos de 3h</span>";

            return;
        }

        let trabajado =
            minReal - minEntrada;

        trabajadoMes += trabajado;

        let saldo =
            trabajado - OBJETIVO_DIARIO;

        saldoSemana += saldo;
        acumulado += saldo;

       let saldoCelda =
			fila.querySelector(".saldo");

		saldoCelda.textContent =
			formatoSaldo(saldo);

		saldoCelda.className =
			saldo >= 0
			? "saldo positivo"
			: "saldo negativo";

        let acumuladoCelda =
            fila.querySelector(".acumulado");

        acumuladoCelda.textContent =
            formatoSaldo(acumulado);

        acumuladoCelda.className =
            acumulado >= 0
            ? "acumulado positivo"
            : "acumulado negativo";
    });
	
	let diasHabilesReales =
		diasHabilesMes - cantidadFeriados;

		let objetivoMensualReal =
		diasHabilesReales *
		OBJETIVO_DIARIO;

	let diferencia =
		trabajadoMes -
		objetivoMensualReal;

    let html = `
		
		<b>Días hábiles:</b>
		${diasHabilesReales}
		<br><br>

		<b>Objetivo diario:</b>
		06:00 horas
		<br><br>
		
		<b>Objetivo mensual:</b>
		${horaDesdeMinutos(objetivoMensualReal)}
		<br><br>

		<b>Horas realizadas:</b>
		${horaDesdeMinutos(trabajadoMes)}
		<br><br>

		<b>Saldo acumulado:</b>
		<span class="${
			diferencia >= 0
			? "positivo"
			: "negativo"
		}">
		${formatoSaldo(diferencia)}
		</span><br><br>
		`;

    if(diferencia < 0){

		html += `
		<div class="faltante">
		TE FALTAN
		${horaDesdeMinutos(
			Math.abs(diferencia)
		)}
		HORAS
		</div>
		`;

	}else if(diferencia > 0){

		html += `
		<div class="sobrante">
		TE SOBRAN
		${horaDesdeMinutos(
			diferencia
		)}
		HORAS
		</div>
		`;

	}else{

		html += `
		<div class="sobrante">
		OBJETIVO MENSUAL CUMPLIDO
		</div>
		`;
	}

    document.getElementById("resumen")
        .innerHTML = html;
}

document.addEventListener(
    "input",
    function(){

        recalcular();

        guardarPeriodoFirebase();
    }
);

document
.getElementById("mes")
.addEventListener(
    "change",
    cambiarPeriodo
);

document
.getElementById("anio")
.addEventListener(
    "change",
    cambiarPeriodo
);

document.addEventListener(
    "change",
    function(e){


        if(
            e.target.classList.contains(
                "tipoDia"
            )
        ){
            actualizarTipoDia();
        }
    }
);

async function guardarPeriodoFirebase(){

     if(!window.usuarioActual){
        return;
    }

    try{

        const periodo =
            obtenerPeriodo();

        const registros = [];

        document
            .querySelectorAll(
                "#tabla tbody tr:not(.semana)"
            )
            .forEach(fila=>{

                registros.push({

                    tipo:
                        fila.querySelector(".tipoDia").value,

                    entrada:
                        fila.querySelector(".entrada").value,

                    salida:
                        fila.querySelector(".real").value
                });

            });

        await window.setDoc(

            window.doc(
                window.db,
                "usuarios",
                window.usuarioActual.uid,
                "periodos",
                periodo
            ),

            {
                periodo: periodo,
                registros: registros,
                actualizado:
                    new Date().toISOString()
            }

        );

        console.log(
            "Periodo guardado en Firestore:",
            periodo
        );

    }catch(error){

        console.error(
            "Error guardando Firestore:",
            error
        );

    }

}

async function cargarPeriodoFirebase(){

    if(!window.usuarioActual){
        return;
    }

    try{

        const periodo =
            obtenerPeriodo();

        const documento =
            await window.getDoc(

                window.doc(
                    window.db,
                    "usuarios",
                    window.usuarioActual.uid,
                    "periodos",
                    periodo
                )

            );

        if(!documento.exists()){

            document
                .querySelectorAll(
                    "#tabla tbody tr:not(.semana)"
                )
                .forEach(fila => {

                    fila.querySelector(".tipoDia").value = "normal";
                    fila.querySelector(".entrada").value = "";
                    fila.querySelector(".real").value = "";

                });

            actualizarTipoDia();
            recalcular();

            return;
        }

        const datos =
            documento.data();

        const filas =
            document.querySelectorAll(
                "#tabla tbody tr:not(.semana)"
            );

        datos.registros.forEach(
            (registro,index)=>{

                if(!filas[index]){
                    return;
                }

                filas[index]
                    .querySelector(".tipoDia")
                    .value =
                    registro.tipo || "";

                filas[index]
                    .querySelector(".entrada")
                    .value =
                    registro.entrada || "";

                filas[index]
                    .querySelector(".real")
                    .value =
                    registro.salida || "";

            }
        );

        actualizarTipoDia();
        recalcular();

        console.log(
            "Periodo cargado desde Firestore:",
            periodo
        );

    }catch(error){

        console.error(
            "Error cargando Firestore:",
            error
        );

    }

}

const hoy =
    new Date();

document.getElementById("mes")
    .value =
    hoy.getMonth();

document.getElementById("anio")
    .value =
    hoy.getFullYear();

generarMes();

periodoActual = obtenerPeriodo();

</script>

    getFirestore,
    doc,
    setDoc,

  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyCATIddYi740alPZN2pclQC3kdprVIlRfs",
    authDomain: "control-horario-fef24.firebaseapp.com",
    projectId: "control-horario-fef24",
    storageBucket: "control-horario-fef24.firebasestorage.app",
    messagingSenderId: "280269536972",
    appId: "1:280269536972:web:9f305847ef3506af4d8c69",
    measurementId: "G-9D9EY1YDHG"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const db = getFirestore(app);

window.db = db;
window.doc = doc;
window.setDoc = setDoc;
window.getDoc = getDoc;
window.deleteDoc = deleteDoc;
window.auth = auth;

console.log("Firebase conectado");

window.GoogleAuthProvider = GoogleAuthProvider;
window.signInWithPopup = signInWithPopup;
window.signOut = signOut;

window.loginGoogle = async function(){

    try{

        const provider =
            new GoogleAuthProvider();

        await signInWithPopup(
            auth,
            provider
        );

    }catch(error){

        console.error(
            "Error Login:",
            error
        );

    }

};

window.logout = async function(){

    try{

        await signOut(auth);

    }catch(error){

        console.error(
            "Error Logout:",
            error
        );

    }

};

onAuthStateChanged(auth, async (user)=>{
    if(!user){

        document.getElementById(
            "usuario"
        ).innerHTML = `
            <button onclick="loginGoogle()">
                Iniciar sesión con Google
            </button>
        `;

        return;
    }


    document.getElementById("usuario").innerHTML = `
        <div style="
            display:flex;
            align-items:center;
            gap:10px;
            background:#1976d2;
            color:white;
            padding:10px;
            border-radius:12px;
        ">

            <img
                src="${user.photoURL || 'macaco.png'}"
                width="50"
                height="50"
                style="
                    border-radius:50%;
                    object-fit:cover;">
                    ${user.email}
                </div>
            </div>

            <button onclick="logout()">
                Salir
            </button>

        </div>
        `;
    window.usuarioActual = user;
    await cargarPeriodoFirebase();

});

if (typeof cargarPeriodoFirebase === "function") {
    cargarPeriodoFirebase();
}

const pruebaFirestore = async () => {

  try {

    const documento = doc(
      db,
      "pruebas",
      "conexion"
    );

    await setDoc(documento, {
      fecha: new Date().toISOString(),
      mensaje: "Conexión OK"
    });

    console.log(
      "Documento guardado en Firestore"
    );

  } catch(error) {

    console.error(
      "Error Firestore:",
      error
    );

  }

};

pruebaFirestore();

</script>

</body>
</html>
